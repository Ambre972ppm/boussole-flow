<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Boussole Flow — V6 contrôle</title><style>
:root{--bg:#faf6ff;--paper:#fff;--ink:#2d2441;--muted:#756c83;--line:#eadff5;--p1:#3e236f;--p2:#7a55c4;--p3:#bca0e9;--pink:#efcfe4;--sage:#dce9df;--gold:#f0e5c6;--shadow:0 18px 45px rgba(61,35,111,.1)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#efe3ff 0,transparent 28%),linear-gradient(#fffafd,#f5f0fa);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}
button,input,select,textarea{font:inherit}.wrap{width:min(1050px,calc(100% - 28px));margin:auto;padding:26px 0 64px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;letter-spacing:.08em}.badge{font-size:12px;color:var(--muted)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;padding-top:50px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:800;color:var(--p2)}h1,h2{font-family:Georgia,serif;letter-spacing:-.025em}.hero h1{font-size:clamp(42px,6vw,70px);line-height:1.02;margin:10px 0 18px}.lead{font-size:18px;line-height:1.55;color:var(--muted)}.pills{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.pill{background:white;border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-size:13px}.primary,.secondary{border:0;border-radius:16px;padding:14px 19px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--p1),var(--p2));color:white;box-shadow:0 10px 26px rgba(61,35,111,.22)}.secondary{background:white;border:1px solid var(--line);color:var(--ink)}

.features{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}.card{background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.card small{display:block;color:var(--muted);margin-top:6px;line-height:1.45}

.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:10px 12px;cursor:pointer}.chip.on{background:#efe5fa;border-color:var(--p2);color:var(--p1)}

.group{margin-top:34px}.jobs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.job{background:white;border:1px solid var(--line);border-radius:22px;padding:18px}.family{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--p2);font-weight:800}.scores{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.score{font-size:12px;background:#f2e8fb;border-radius:999px;padding:7px 9px}.score.a{background:var(--sage)}.score.c{background:var(--gold)}.score.d{background:#f6e4e8}.job p{color:var(--muted);font-size:14px;line-height:1.45}.confidence{font-size:12px;font-weight:800;color:var(--p2)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:28px 0}.actions button{border:1px solid var(--line);background:white;border-radius:14px;padding:12px 14px;font-weight:800}.notice{background:#fff8ea;border:1px solid #eedeb8;border-radius:16px;padding:14px;font-size:13px;line-height:1.5}
@media(max-width:820px){.hero,.resultHero{grid-template-columns:1fr}.features,.jobs,.formgrid,.itemgrid,.itemgrid4{grid-template-columns:1fr 1fr}.visual{height:340px}}

function changeSector(i,v){st.experiences[i].sector=v;st.experiences[i].role=(DATA.roles[v]||['Autre'])[0];save();profileForm()}
function profileForm(){st.step='profile';save();app.innerHTML=`<div class="wrap">${brand()}<div class="section"><p class="eyebrow">Étape 2 — ton parcours réel</p><h2>On ne devine plus ton CV : on le structure.</h2><p class="sub">Une expérience directe pèse plus qu'une expérience du secteur, puis viennent les qualifications du domaine et les compétences prouvées.</p></div>
<div class="section card"><h3>1. Expériences professionnelles</h3><div class="repeater">${st.experiences.map((x,i)=>`<div class="item"><div class="grid4"><div class="field"><label>Secteur</label><select class="input" onchange="changeSector(${i},this.value)">${sectorOptions(x.sector)}</select></div><div class="field"><label>Métier / famille</label><select class="input" onchange="setVal('experiences',${i},'role',this.value)">${roleOptions(x.sector,x.role)}</select></div><div class="field"><label>Années</label><input class="input" type="number" min="0" max="50" step=".5" value="${x.years}" oninput="setVal('experiences',${i},'years',+this.value)"></div><div class="field"><label>Autonomie</label><select class="input" onchange="setVal('experiences',${i},'autonomy',+this.value)"><option value="1" ${x.autonomy==1?'selected':''}>Débutant</option><option value="2" ${x.autonomy==2?'selected':''}>Opérationnel</option><option value="3" ${x.autonomy==3?'selected':''}>Autonome</option><option value="4" ${x.autonomy==4?'selected':''}>Référent</option><option value="5" ${x.autonomy==5?'selected':''}>Responsable / expert</option></select></div></div><button class="secondary" onclick="rm('experiences',${i})">Supprimer</button></div>`).join('')}</div><button class="secondary" onclick="addExp()">+ Ajouter une expérience</button></div>
<div class="section card"><h3>2. Diplômes, titres et formations</h3><div class="repeater">${st.qualifications.map((x,i)=>`<div class="item"><div class="grid4"><div class="field"><label>Domaine</label><select class="input" onchange="setVal('qualifications',${i},'sector',this.value)">${sectorOptions(x.sector)}</select></div><div class="field"><label>Type</label><select class="input" onchange="setVal('qualifications',${i},'type',this.value)"><option ${x.type==='CAP / BEP'?'selected':''}>CAP / BEP</option><option ${x.type==='Bac'?'selected':''}>Bac</option><option ${x.type==='BTS / Bac+2'?'selected':''}>BTS / Bac+2</option><option ${x.type==='Licence / Bachelor'?'selected':''}>Licence / Bachelor</option><option ${x.type==='Master / Bac+5'?'selected':''}>Master / Bac+5</option><option ${x.type==='Titre RNCP'?'selected':''}>Titre RNCP</option><option ${x.type==='Formation qualifiante'?'selected':''}>Formation qualifiante</option><option ${x.type==='Certification professionnelle'?'selected':''}>Certification professionnelle</option><option ${x.type==='Formation courte'?'selected':''}>Formation courte</option></select></div><div class="field"><label>Niveau</label><select class="input" onchange="setVal('qualifications',${i},'level',+this.value)">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${x.level==n?'selected':''}>${x.type==='Titre RNCP'?'RNCP '+n:'Niveau '+n}</option>`).join('')}</select></div><div class="field"><label>Spécialité</label><input class="input" value="${x.specialty}" placeholder="Ex. Front-End" oninput="setVal('qualifications',${i},'specialty',this.value)"></div></div><button class="secondary" onclick="rm('qualifications',${i})">Supprimer</button></div>`).join('')}</div><button class="secondary" onclick="addQual()">+ Ajouter un diplôme / titre</button></div>
<div class="section card"><h3>3. Compétences acquises</h3><div class="repeater">${st.skills.map((x,i)=>`<div class="item"><div class="grid3"><div class="field"><label>Compétence</label><select class="input" onchange="setVal('skills',${i},'name',this.value)">${DATA.skillCatalog.map(s=>`<option ${s===x.name?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Niveau</label><select class="input" onchange="setVal('skills',${i},'level',+this.value)"><option value="1" ${x.level==1?'selected':''}>Débutant</option><option value="2" ${x.level==2?'selected':''}>Opérationnel</option><option value="3" ${x.level==3?'selected':''}>Autonome</option><option value="4" ${x.level==4?'selected':''}>Avancé</option><option value="5" ${x.level==5?'selected':''}>Expert</option></select></div><div class="field"><label>Acquise par</label><select class="input" onchange="setVal('skills',${i},'source',this.value)"><option ${x.source==='Expérience professionnelle'?'selected':''}>Expérience professionnelle</option><option ${x.source==='Diplôme / formation'?'selected':''}>Diplôme / formation</option><option ${x.source==='Certification'?'selected':''}>Certification</option><option ${x.source==='Projet personnel'?'selected':''}>Projet personnel</option><option ${x.source==='Autodidacte'?'selected':''}>Autodidacte</option><option ${x.source==='Bénévolat'?'selected':''}>Bénévolat</option></select></div></div><button class="secondary" onclick="rm('skills',${i})">Supprimer</button></div>`).join('')}</div><button class="secondary" onclick="addSkill()">+ Ajouter une compétence</button></div>
<div class="section card"><h3>4. Passions durables</h3><p class="sub">Elles influencent l'affinité, pas l'accessibilité.</p><div class="repeater">${st.passions.map((x,i)=>`<div class="item"><div class="grid3"><div class="field"><label>Passion</label><input class="input" value="${x.label}" placeholder="Ex. peinture" oninput="setVal('passions',${i},'label',this.value)"></div><div class="field"><label>Années</label><input class="input" type="number" min="0" value="${x.years}" oninput="setVal('passions',${i},'years',+this.value)"></div><div class="field"><label>Intensité</label><select class="input" onchange="setVal('passions',${i},'intensity',+this.value)"><option value="1" ${x.intensity==1?'selected':''}>Occasionnelle</option><option value="2" ${x.intensity==2?'selected':''}>Régulière</option><option value="3" ${x.intensity==3?'selected':''}>Forte</option><option value="4" ${x.intensity==4?'selected':''}>Très forte</option></select></div></div><button class="secondary" onclick="rm('passions',${i})">Supprimer</button></div>`).join('')}</div><button class="secondary" onclick="addPassion()">+ Ajouter une passion</button></div>
<div class="section card"><h3>5. Contraintes réelles</h3><div class="formgrid"><div class="field"><label>Travail physique acceptable</label><select class="input" onchange="st.constraints.physical=+this.value;save()">${[1,2,3,4,5].map(n=>`<option value="${n}" ${st.constraints.physical==n?'selected':''}>${['','Très faible','Faible','Modéré','Élevé','Très élevé'][n]}</option>`).join('')}</select></div><div class="field"><label>Contact humain souhaité</label><select class="input" onchange="st.constraints.people=+this.value;save()">${[1,2,3,4,5].map(n=>`<option value="${n}" ${st.constraints.people==n?'selected':''}>${['','Très faible','Faible','Modéré','Élevé','Très élevé'][n]}</option>`).join('')}</select></div><div class="field"><label>Bruit / stimulation acceptable</label><select class="input" onchange="st.constraints.noise=+this.value;save()">${[1,2,3,4,5].map(n=>`<option value="${n}" ${st.constraints.noise==n?'selected':''}>${['','Très faible','Faible','Modéré','Élevé','Très élevé'][n]}</option>`).join('')}</select></div><div class="field"><label>Horaires décalés</label><select class="input" onchange="st.constraints.shift=this.value;save()"><option value="no" ${st.constraints.shift==='no'?'selected':''}>Non</option><option value="maybe" ${st.constraints.shift==='maybe'?'selected':''}>À petite dose</option><option value="yes" ${st.constraints.shift==='yes'?'selected':''}>Oui</option></select></div></div></div><div class="section"><button class="primary" onclick="compute()">Calculer ma compatibilité durable →</button></div></div>`}
function traitScores(){const raw={};Object.keys(DATA.dims).forEach(k=>raw[k]=0);st.answers.forEach((a,qi)=>{if(a==null)return;Object.entries(DATA.questions[qi][2][a][1]).forEach(([k,v])=>raw[k]+=v)});const max=Math.max(...Object.values(raw),1),out={};Object.entries(raw).forEach(([k,v])=>out[k]=Math.round(v/max*100));return out}
function personalityProfile(sc){const t=Object.entries(sc).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);if(t.includes('human')&&t.includes('impact'))return['Le Pilier humain','Tu sembles t’engager quand ton travail a une utilité perceptible et une dimension humaine forte.'];if(t.includes('manual')&&(t.includes('precision')||t.includes('action')))return['Le Faiseur concret','Tu sembles t’accomplir dans l’action, le geste et un résultat visible.'];if(t.includes('analysis')&&(t.includes('numbers')||t.includes('deep')))return['L’Analyste explorateur','Comprendre et aller au fond des problèmes semble être un moteur important.'];if(t.includes('structure')&&t.includes('precision'))return['Le Fiable méthodique','La maîtrise, la précision et un cadre clair semblent soutenir ton efficacité.'];if(t.includes('create'))return['Le Créateur','Imaginer, façonner et renouveler sont probablement des moteurs importants.'];return['Le Profil hybride','Ton fonctionnement combine plusieurs moteurs : l’environnement comptera autant que le métier.']}
function mental(job,sc){let w=0,t=0;Object.entries(job.fit).forEach(([k,v])=>{w+=(sc[k]||0)*v;t+=v});return Math.round(w/Math.max(1,t))}
function exactYears(job){return st.experiences.filter(e=>e.sector===job.sector&&e.role===job.role).reduce((a,e)=>a+(+e.years||0),0)}
function sectorYears(job){return st.experiences.filter(e=>e.sector===job.sector).reduce((a,e)=>a+(+e.years||0),0)}
function roleAutonomy(job){return Math.max(0,...st.experiences.filter(e=>e.sector===job.sector&&e.role===job.role).map(e=>+e.autonomy||0))}
function qualificationScore(job){let best=0;st.qualifications.forEach(q=>{if(q.sector!==job.sector)return;let s=20;if((q.type||'').includes('RNCP')||(q.type||'').includes('Licence')||(q.type||'').includes('Master')||(q.type||'').includes('BTS')||(q.type||'').includes('CAP')||q.type==='Bac')s+=20;if((q.type||'').includes('Certification'))s+=15;if((q.type||'').includes('qualifiante'))s+=10;s+=Math.min(30,(+q.level||0)*5);best=Math.max(best,s)});return Math.min(100,best)}
function skillProof(job){if(!job.skills.length)return 60;let total=0;job.skills.forEach(req=>{let best=0;st.skills.filter(s=>s.name===req||req.toLowerCase().includes((s.name||'').toLowerCase())||(s.name||'').toLowerCase().includes(req.toLowerCase())).forEach(s=>{let p=(+s.level||0)*15;if(s.source==='Expérience professionnelle')p+=20;else if(s.source==='Diplôme / formation')p+=15;else if(s.source==='Certification')p+=18;else if(s.source==='Projet personnel')p+=10;else if(s.source==='Autodidacte')p+=7;else if(s.source==='Bénévolat')p+=8;best=Math.max(best,p)});total+=Math.min(100,best)});return Math.round(total/job.skills.length)}
function accessibility(job){const ey=exactYears(job),sy=sectorYears(job),aut=roleAutonomy(job),qs=qualificationScore(job),sp=skillProof(job);let score=10;if(ey>0){score+=Math.min(62,ey*19);score+=aut*5}else if(sy>0){score+=Math.min(28,sy*8)}score+=qs*.22+sp*.28;if(job.cert&&qs<45&&sp<45)score-=22;if(job.physical>st.constraints.physical)score-=(job.physical-st.constraints.physical)*12;if(job.people>st.constraints.people+1)score-=(job.people-st.constraints.people-1)*6;if(job.noise>st.constraints.noise+1)score-=(job.noise-st.constraints.noise-1)*7;if(job.shift&&st.constraints.shift==='no')score-=14;return Math.max(5,Math.min(98,Math.round(score)))}
function deepAffinity(job,sc){let a=mental(job,sc),txt=(job.name+' '+job.family+' '+job.sector+' '+job.role).toLowerCase(),bonus=0;st.passions.forEach(p=>{let label=(p.label||'').toLowerCase(),tokens=label.split(/\s+/).filter(x=>x.length>3);if(tokens.some(t=>txt.includes(t)))bonus+=Math.min(18,(+p.intensity||1)*4+(+p.years||0))});return Math.max(5,Math.min(98,Math.round(a*.75+Math.min(95,a+bonus)*.25)))}
function durability(job,sc,aff){let d=aff,mm=[];if(job.physical>st.constraints.physical){d-=10*(job.physical-st.constraints.physical);mm.push('niveau physique demandé supérieur à ton seuil déclaré')}if(job.noise>st.constraints.noise+1){d-=8*(job.noise-st.constraints.noise-1);mm.push('environnement plus bruyant ou stimulant que souhaité')}if(job.shift&&st.constraints.shift==='no'){d-=14;mm.push('horaires décalés incompatibles avec ta préférence')}if(job.people>=4&&(sc.human||50)<45){d-=10;mm.push('niveau de contact humain potentiellement fatigant')}return{score:Math.max(5,Math.min(98,Math.round(d))),mismatch:mm}}
function confidence(){let c=42+Math.min(30,st.answers.length)+Math.min(12,st.experiences.length*4)+Math.min(10,st.qualifications.length*4)+Math.min(10,st.skills.length*3)+Math.min(6,st.passions.length*2);return Math.min(98,c)}
function compute(){const sc=traitScores(),prof=personalityProfile(sc),conf=confidence();const ranked=DATA.jobs.map(j=>{const m=mental(j,sc),deep=deepAffinity(j,sc),acc=accessibility(j),cap=Math.round(skillProof(j)*.55+qualificationScore(j)*.25+Math.min(100,exactYears(j)*25)*.20),dur=durability(j,sc,Math.round(m*.65+deep*.35));let global=Math.round(deep*.27+m*.25+cap*.16+acc*.17+dur.score*.15);if(deep<40)global=Math.min(global,58);if(dur.score<40)global=Math.min(global,56);return{j,m,deep,acc,cap,dur:dur.score,mismatch:dur.mismatch,global,confidence:conf,ey:exactYears(j),sy:sectorYears(j)}}).sort((a,b)=>b.global-a.global);st.result={sc,prof,ranked,confidence:conf};save();results()}
function classify(x){if(x.deep>=65&&x.m>=65&&x.acc>=65&&x.dur>=65)return'now';if(x.deep>=65&&x.m>=65&&x.acc<65)return'reconversion';if(x.acc>=75&&x.deep<55)return'access';return'explore'}
function results(){const r=st.result;if(!r)return home(),top=Object.entries(r.sc).sort((a,b)=>b[1]-a[1]).slice(0,8),groups={now:[],reconversion:[],explore:[],access:[]};r.ranked.slice(0,28).forEach(x=>groups[classify(x)].push(x));const cards=arr=>arr.slice(0,8).map(x=>`<article class="job"><span class="family">${x.j.family}</span><h3>${x.j.name}</h3><div class="scores"><span class="score">💜 ${x.deep}%</span><span class="score">🧠 ${x.m}%</span><span class="score c">🛠️ ${x.cap}%</span><span class="score a">🚀 ${x.acc}%</span><span class="score d">🌱 ${x.dur}%</span></div><p><b>Compatibilité durable : ${x.global}%</b></p><p>${x.j.desc}</p>${x.ey>0?`<p><b>Preuve forte :</b> ${x.ey} an(s) d’expérience directe déclarée.</p>`:x.sy>0?`<p><b>Preuve secteur :</b> ${x.sy} an(s) dans ce secteur.</p>`:''}<p class="confidence">Confiance : ${x.confidence}%</p>${x.mismatch.length?`<p><b>Vigilance :</b> ${x.mismatch.join(' ; ')}.</p>`:''}</article>`).join('')||'<p class="sub">Aucune piste forte ici.</p>';app.innerHTML=`<div class="wrap">${brand()}<div class="resultHero"><div class="profile"><p class="eyebrow" style="color:#d8c7ff">Ton profil</p><h1>${r.prof[0]}</h1><p>${r.prof[1]}</p><p><b>Moteurs dominants :</b> ${top.slice(0,5).map(x=>DATA.dims[x[0]]).join(' • ')}</p></div><div class="meters"><h3>Ta carte de fonctionnement</h3>${top.map(([k,v])=>`<div class="meterrow"><span>${DATA.dims[k]}</span><div class="meter"><i style="width:${v}%"></i></div><b>${v}</b></div>`).join('')}</div></div><div class="group"><h2>Très cohérent aujourd’hui</h2><div class="jobs">${cards(groups.now)}</div></div><div class="group"><h2>Forte affinité, transition à construire</h2><div class="jobs">${cards(groups.reconversion)}</div></div><div class="group"><h2>Pistes à explorer</h2><div class="jobs">${cards(groups.explore)}</div></div><div class="group"><h2>Accessible, mais peut-être peu nourrissant</h2><div class="jobs">${cards(groups.access)}</div></div><div class="actions"><button onclick="saveResult()">💾 Enregistrer</button><button onclick="window.print()">📄 PDF / imprimer</button><button onclick="mail()">✉️ Me l’envoyer</button><button onclick="restart()">↻ Refaire</button></div><div class="notice"><b>Important :</b> Boussole ne diagnostique pas TDA/TDAH/HPI. Une expérience exacte pèse davantage qu’un intérêt, et l’affinité reste distincte de l’accessibilité.</div></div>`}
function saveResult(){localStorage.setItem('boussoleFlowV6Result',JSON.stringify(st.result));alert('Bilan enregistré sur cet appareil.')}
function mail(){const top=st.result.ranked.slice(0,6).map((x,i)=>`${i+1}. ${x.j.name} — compatibilité ${x.global}% / accessibilité ${x.acc}%`).join('\n');location.href='mailto:?subject='+encodeURIComponent('Mon bilan Boussole Flow')+'&body='+encodeURIComponent(top)}
function restart(){if(confirm('Recommencer le test ?')){localStorage.removeItem(K);location.reload()}}
home();</script></body></html>
